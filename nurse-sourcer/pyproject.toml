[project]
name = "nurse-sourcer"
version = "0.1.0"
description = "Find Filipino registered nurses interested in moving to Germany for a given hospital job brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nurse-sourcer" }]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.45.0",
    "praw>=7.7.0",
    "google-api-python-client>=2.120.0",
    "ddgs>=6.0.0",
    "yt-dlp>=2024.8.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.scripts]
nurse-sourcer = "nurse_sourcer.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nurse_sourcer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
